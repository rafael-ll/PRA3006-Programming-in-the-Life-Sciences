<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Type 1 Diabetes Genes</title>
</head>

<body>
    <h1>How are genes associated with Type 1 Diabetes connected in their biological functions?</h1>

    <p>Some genes are associated with T1D risk.</p>

    <h2>Genes associated with Type 1 Diabetes</h2>

    <div id="gene-list"></div>

    <script>
        // SPARQL QUERY
        // "DISTINCT" removes duplicate combinations of the selected values
        // WHERE specifies relation: T1D (Q124407) -> association (p2293) -> to gene variable
        // Which proteins are encoded by the genes: ?gene -> encodes (wdt:P688) -> ?protein.
        // linking to the bio processes: protein -> linked biological process (wdt:P682)
        // retrieving actual processes names -> rdfs:label in english (FILTER(LANG()="en"))
        // SUBQUERY: SELECT the same bioprocesses, GROUP them by process, and retains only the processes related to 2 or more genes. 
        let query = `
    SELECT DISTINCT ?gene ?geneLabel ?process ?processLabel
    WHERE {
        wd:Q124407 wdt:P2293 ?gene.

        ?gene wdt:P688 ?protein.
        ?protein wdt:P682 ?process. 

        ?gene rdfs:label ?geneLabel.
        ?process rdfs:label ?processLabel.

        FILTER(LANG(?geneLabel) = "en")
        FILTER(LANG(?processLabel) = "en")

        {
            SELECT ?process
            WHERE {
                wd:Q124407 wdt:P2293 ?associatedGene.
                ?associatedGene wdt:P688 ?associatedProtein.
                ?associatedProtein wdt:P682 ?process.
            }
            GROUP BY ?process
            HAVING (COUNT(DISTINCT ?associatedGene) >= 2)
        }
    }
    ORDER BY ?processLabel ?geneLabel
    LIMIT 1000
`;

        // Wikidata URL
        let url = "https://query.wikidata.org/sparql?query="
                  + encodeURIComponent(query)
                  + "&format=json";

        // Request data from Wikidata
        fetch(url)
            .then(response => response.json())
            .then(data => {

                // Extract the results
                let results = data.results.bindings;

                // Display each gene on the webpage
                for (let item of results) {

                    let paragraph = document.createElement("p");

                    paragraph.textContent = item.geneLabel.value
                        + " → "
                        + item.processLabel.value;

                    document.getElementById("gene-list").appendChild(paragraph);
                }
            })
            .catch(error => console.error("Error:", error));

    </script>

</body>
</html>
